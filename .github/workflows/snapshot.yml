name: Snapshot to GitHub Packages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    uses: JRebirth/JRebirth-Organization-POM/.github/workflows/reusable-maven-snapshot.yml@master
    with:
      java-version: "25"
      pom-path: org.jrebirth.site.jrebirth-skin/pom.xml
      maven-args: "-B -Pgithub-packages deploy"
    secrets: inherit
